[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debuglab"
version = "0.2.0"
description = "Reproducible Defects4J localization and repair experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "transformers==4.57.6", "tree-sitter==0.25.2", "tree-sitter-java==0.23.5", "rank-bm25>=0.2.2", "numpy>=1.26", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
debuglab = "debuglab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["work", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real installed Defects4J and Java"]
